name: Clear GitHub Pages

on:
  workflow_dispatch:   # manual trigger only

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  clear:
    runs-on: ubuntu-latest

    steps:
      - name: Create empty site
        run: |
          mkdir dist
          echo "<h1>Site cleared</h1>" > dist/index.html

      - name: Upload empty artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: clear
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy empty site
        id: deployment
        uses: actions/deploy-pages@v4
